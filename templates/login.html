{% extends "base.html" %}
{% block title %}Sign In | Librain{% endblock %}

{% block content %}
<div class="login-card">
  <div class="login-header">
    <div class="login-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
    </div>
    <p class="eyebrow">LIBRAIN PORTAL</p>
    <h1>Welcome Back</h1>
    <p class="subtitle">Please enter your credentials to access the library dashboard.</p>
  </div>

  <form method="post" class="login-form">
    <div>
      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" name="username" required placeholder="Enter username" autofocus autocomplete="username">
    </div>

    <div>
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" name="password" required placeholder="Enter password" autocomplete="current-password">
    </div>

    <button type="submit" class="btn primary full" style="height: 44px; margin-top: 6px; font-size: 14px;">
      Sign In
    </button>
  </form>
</div>
{% endblock %}
