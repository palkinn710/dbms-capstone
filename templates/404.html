{% extends "base.html" %}
{% block page_name %}Error 404{% endblock %}

{% block content %}
<div class="panel" style="text-align: center; padding: 60px 20px; max-width: 540px; margin: 40px auto;">
  <div style="font-size: 54px; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 12px;">404</div>
  <h2 style="font-size: 20px; margin-bottom: 8px;">Resource Not Found</h2>
  <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 24px;">The requested page or catalog entry could
    not be located on the server.</p>
  <a href="{{ url_for('dashboard') }}" class="btn primary">Return to Dashboard</a>
</div>
{% endblock %}
